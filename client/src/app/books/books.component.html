<h2>Find a book</h2>

<form (submit)="$event.preventDefault(); submit(bookQuery.value)">
  <label for="book-id">Book ID</label>
  <input
    #bookQuery
    id="book-id"
    inputmode="numeric"
    pattern="[0-9]+"
    required
  >
  <button type="submit">Search</button>
</form>

<router-outlet></router-outlet>
